<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de estruturas e contingência da BFORGEADS.">
    <title>Catálogo - BFORGEADS</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="BFORGEADS Logo" class="logo-img">
            </a>
            
            <nav class="nav-links">
                <a href="index.html" class="btn btn-outline neon-border" style="margin-top: 0; padding: 8px 16px;">
                    <i class="fas fa-arrow-left"></i>
                    <span>Voltar</span>
                </a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Catalog Header -->
        <section class="catalog-header section-padding" style="padding-bottom: 40px; padding-top: 120px;">
            <div class="container text-center">
                <h1 class="section-title">Catálogo de <span class="gradient-text">Ativos</span></h1>
                <p class="section-desc">Escolha a estrutura ideal para a sua operação. Produtos com reposição garantida.</p>
            </div>
        </section>

        <!-- Catalog Filters -->
        <section class="catalog-filters">
            <div class="container">
                <div class="filter-tabs" id="filter-tabs">
                    <!-- Gerado via JS -->
                    <button class="filter-btn active" data-category="all">Todos</button>
                </div>
            </div>
        </section>

        <!-- Catalog Products Grid -->
        <section class="catalog-products section-padding" style="padding-top: 30px;">
            <div class="container">
                <div class="grid grid-3" id="products-grid">
                    <!-- Gerado via JS -->
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin neon-text" style="font-size: 2rem;"></i>
                        <p>Carregando catálogo...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Floating WhatsApp Button (Mobile Only) -->
        <!-- Mobile Bottom Navigation -->
        <nav class="mobile-bottom-bar">
            <a href="index.html" class="bottom-bar-item">
                <i class="fas fa-home"></i>
                <span>Início</span>
            </a>
            <a href="catalogo.html" class="bottom-bar-item active highlight-catalog">
                <i class="fas fa-shopping-cart"></i>
                <span>Catálogo</span>
            </a>
            <a href="https://wa.me/5551980907413?text=Olá,%20estou%20no%20catálogo%20e%20quero%20tirar%20uma%20dúvida!" target="_blank" class="bottom-bar-item whatsapp-btn">
                <i class="fab fa-whatsapp"></i>
                <span>Suporte</span>
            </a>
        </nav>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            <div class="container">
                <p>&copy; 2026 BFORGEADS. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="catalogo.js"></script>
</body>
</html>
